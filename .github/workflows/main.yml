name: Build Vybora APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "vybora-android/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: vybora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash
        working-directory: vybora-android

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Install Android build tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname "CN=Vybora Debug,O=Vybora,C=IN" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build universal debug APK
        run: |
          gradle :app:assembleUniversalFossDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            2>&1 | tee build.log

      - name: Prepare Vybora APK
        run: |
          apk_path="$(find app/build/outputs/apk -type f -name '*debug*.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp "$apk_path" "$GITHUB_WORKSPACE/apk/Vybora-debug.apk"

      - name: Upload Vybora APK
        uses: actions/upload-artifact@v4
        with:
          name: Vybora-APK
          path: apk/Vybora-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vybora-build-log
          path: vybora-android/build.log
          if-no-files-found: ignore
          retention-days: 7
