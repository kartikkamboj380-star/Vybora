name: Build Vybora APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the APK as a GitHub release under this tag (e.g. v1.4.4). Leave empty to build only."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "vybora-android/**"
      - ".github/workflows/main.yml"
  pull_request:
    branches: [main]
    paths:
      - "vybora-android/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: vybora-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal GMS APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    defaults:
      run:
        shell: bash
        working-directory: vybora-android

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle caching and wrapper validation
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Check resources and test CI tooling
        run: |
          python3 -B scripts/check_android_resources.py
          python3 -B -m unittest discover -s scripts/tests -v

      # GitHub's Ubuntu image already has the Android command-line tools.
      # Do not reinstall the obsolete "tools" package via setup-android.
      - name: Install Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > sdk-licenses.log 2>&1
          set -o pipefail
          "$sdkmanager" --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" 2>&1 | tee sdk.log
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Create debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname "CN=Vybora Debug,O=Vybora,C=IN" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build universal GMS debug APK
        run: |
          ./gradlew :app:assembleUniversalGmsDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            2>&1 | tee build.log

      - name: Prepare and verify Vybora APK
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*debug*.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one universal debug APK, found ${#apks[@]}."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp "${apks[0]}" "$GITHUB_WORKSPACE/apk/Vybora-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "$GITHUB_WORKSPACE/apk/Vybora-debug.apk"
          cd "$GITHUB_WORKSPACE/apk"
          sha256sum Vybora-debug.apk > Vybora-debug.apk.sha256
          printf '### Vybora APK ready\n\nDownload **Vybora-APK** from this run’s Artifacts.\n\nThis is a debug-signed universal GMS APK for testing, not a Play Store release.\n' >> "$GITHUB_STEP_SUMMARY"

      # Proves the APK that gets released really carries the music video and the lite caches,
      # rather than being a build of some older source.
      - name: Check the APK carries the music video and lite caches
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/apk/Vybora-debug.apk"

          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" \
            | head -5

          resources="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump resources "$apk")"
          for marker in ic_music_video network_security_config; do
            if ! grep -q "$marker" <<<"$resources"; then
              echo "::error::The APK has no $marker resource."
              exit 1
            fi
            echo "The APK carries the $marker resource."
          done

          # The classes are compiled into the dex, so their names show up in the strings table.
          for dex in $(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\.dex$'); do
            unzip -p "$apk" "$dex" | strings -a
          done \
            | grep -oE 'L[a-zA-Z0-9/]*(MusicVideoBackground|MusicVideoResolver|CacheGovernor);' \
            | sort -u > "$GITHUB_WORKSPACE/apk/feature-markers.txt" || true

          cat "$GITHUB_WORKSPACE/apk/feature-markers.txt"

          for feature in MusicVideoBackground MusicVideoResolver CacheGovernor; do
            if ! grep -q "$feature" "$GITHUB_WORKSPACE/apk/feature-markers.txt"; then
              echo "::error::The APK does not contain $feature."
              exit 1
            fi
          done

          printf '### The APK carries the music video and the lite caches.\n\n%s\n' \
            "$(cat "$GITHUB_WORKSPACE/apk/feature-markers.txt")" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Vybora APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Vybora-APK
          path: apk/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish failure diagnostics
        if: failure()
        run: python3 -B scripts/report_ci_failure.py sdk-licenses.log sdk.log build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Vybora-build-logs
          path: |
            vybora-android/sdk-licenses.log
            vybora-android/sdk.log
            vybora-android/build.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    # Only when a release was asked for; the plain build runs publish nothing.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download the built APK
        uses: actions/download-artifact@v7.0.0
        with:
          name: Vybora-APK
          path: apk

      - name: Write the release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 -B - <<'PY'
          import json
          import os

          data = json.load(open("vybora-android/upcomingupdate.json", encoding="utf-8"))
          features = data.get("features") or []
          fixes = data.get("bug_fixes") or []

          lines = [
              "## Vybora %s" % os.environ["RELEASE_TAG"],
              "",
              "The now-playing screen can play the song's **music video** behind the player while the",
              "audio keeps playing, and the app itself is a lot lighter on disk and in memory.",
              "",
              "### 🎬 Music Video",
              "",
              "- **Music video behind the player** — the song's own official video plays behind the",
              "  album art, lyrics and controls while the audio keeps playing from the music service.",
              "- **A toggle where you expect it** — a 42dp button with a note-inside-a-video-frame icon",
              "  in the player control row, in both the new and the old player design. It lights up in",
              "  the app's primary colour when the video is on.",
              "- **Always in sync** — the picture is pulled back into line with the song whenever it",
              "  drifts more than 1.2 seconds away.",
              "- **Muted on purpose** — the video never carries sound and never asks for audio focus.",
              "- **Stops with the screen** — the music goes on in the background, the picture does not.",
              "- **720p ceiling** — capped at 720p with a small 4 MiB buffer, so the video stays cheap.",
              "",
              "### 🪶 Lighter app",
              "",
              "| Cache | Before | Now |",
              "|---|---|---|",
              "| Audio stream cache | 1 GB | **256 MB** (64 MB in Lite mode) |",
              "| Artwork cache | 512 MB | **96 MB** (32 MB in Lite mode) |",
              "| Image memory cache | 25% of heap | **10% of heap** |",
              "| SQLite page cache | 16 MB | **4 MB** |",
              "| Database write-ahead log | checkpointed at 1 MB | checkpointed at **256 KB**, truncated on start |",
              "",
              "- **Lite mode** — one switch in *Settings → Storage → Cache* that clamps both caches to",
              "  their smallest ceilings and trims them on every start.",
              "- **Trim caches now** — reclaims cached audio and artwork immediately.",
              "- **Trimmed on every start** — the least recently played streams, the oldest artwork files",
              "  and the database's write-ahead log are cleaned up when the app comes up.",
              "",
          ]

          if features:
              lines += ["### ✨ What's new", ""] + ["- %s" % f for f in features] + [""]
          if fixes:
              lines += ["### 🛠 Fixes", ""] + ["- %s" % f for f in fixes] + [""]

          lines += [
              "### 📦 About this build",
              "",
              "This is the **universal GMS debug APK** built by GitHub Actions. It is signed with a",
              "disposable debug key, so it is meant for testing and sideloading, **not** for the Play",
              "Store. Uninstall any previous CI debug build before installing, because a new debug key",
              "means a different signature.",
              "",
              "A `SHA-256` checksum for the APK is attached alongside it.",
              "",
              "### 🔨 Build it yourself",
              "",
              "```bash",
              "git clone https://github.com/kartikkamboj380-star/Vybora",
              "cd Vybora/vybora-android",
              "./gradlew assembleUniversalGmsDebug",
              "```",
              "",
          ]

          with open("release-notes.md", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
          PY

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/apk"
          sha256sum -c Vybora-debug.apk.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing its assets."
            gh release upload "$RELEASE_TAG" \
              Vybora-debug.apk Vybora-debug.apk.sha256 --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Vybora $RELEASE_TAG" \
              --notes-file "$GITHUB_WORKSPACE/release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_REF_NAME" \
              --title "Vybora $RELEASE_TAG" \
              --notes-file "$GITHUB_WORKSPACE/release-notes.md" \
              --latest \
              Vybora-debug.apk Vybora-debug.apk.sha256
          fi

      - name: Summarise the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          printf '### Release %s published\n\nThe APK is attached to **%s**.\n' \
            "$RELEASE_TAG" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
